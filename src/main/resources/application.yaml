spring:
  config:
    import: "optional:file:.env[.properties]" # make spring read from .env file
  application:
    name: shieldshare
  datasource:
    url: jdbc:postgresql://localhost:5432/shieldshare
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  database: postgresql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true