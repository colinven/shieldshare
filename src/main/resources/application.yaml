spring:
  application:
    name: shieldshare
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true

server:
  forward-headers-strategy: native # make request.getRemoteAddr() return the client ip, not the edge proxy ip
  servlet:
    context-path: /api/v1

app:
  size-caps:
    max-content-bytes: 1048576 # 1 MiB (content cap). used only for client-side UX only
    max-request-bytes: 1573000 # 1.5 MiB + headroom for base64 overhead, metadata, JSON envelope
    max-blob-bytes: 1052701 # 1 MiB + headroom (content, metadata, version byte, iv, GCM tag)
  encryption-version-byte: "0x00"
  ttl-options-seconds: "300,3600,86400,604800" # 5m, 1h, 24h, 7d
  sweeper:
    pass-limit: 2500
    audit-log-retention: 90d
    access-attempt-retention: 7d