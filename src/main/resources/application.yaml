spring:
  application:
    name: shieldshare
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true

server:
  forward-headers-strategy: native # make request.getRemoteAddr() return the client ip, not the edge proxy ip
  servlet:
    context-path: /api/v1

app:
  size-caps:
    max-content-bytes: 1048576 # 1 MiB (content cap). used only for client-side UX only
    max-request-bytes: 1573000 # 1.5 MiB + headroom for base64 overhead, metadata, JSON envelope
    max-blob-bytes: 1052701 # 1 MiB + headroom (content, metadata, version byte, iv, GCM tag)
  encryption-version-byte: "0x00"
  ttl-options-seconds: "300,3600,86400,604800" # 5m, 1h, 24h, 7d
  sweeper:
    pass-limit: 2500
    audit-log-retention: 90d
    access-attempt-retention: 7d
  rate-limit:
    # secret creation is not affected by circuit breaker
    create:
      requests:
        capacity: 20
        refill-tokens: 10
        refill-period: 1m
      bytes:
        capacity: 4194304 # 4MiB burst
        refill-tokens: 2097152 # 2MiB
        refill-period: 1h
    # lookup endpoints have a tighter limit when the circuit breaker is open
    fetch:
      closed:
        capacity: 20
        refill-tokens: 10
        refill-period: 1m
      open:
        capacity: 3
        refill-tokens: 3
        refill-period: 1m
    # secret validation is less strict than fetch: it is non-destructive, while fetch burns the record
    validate:
      closed:
        capacity: 60
        refill-tokens: 30
        refill-period: 1m
      open:
        capacity: 5
        refill-tokens: 5
        refill-period: 1m
    breaker:
      miss-capacity: 300
      miss-refill-period: 1m
      cooldown: 5m
      probing-capacity: 30
    cache:
      max-size: 100000
      expire-after-access: 10m