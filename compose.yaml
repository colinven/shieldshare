services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shieldshare
      POSTGRES_USER: shieldshare
      POSTGRES_PASSWORD: shieldshare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldshare -d shieldshare"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data: